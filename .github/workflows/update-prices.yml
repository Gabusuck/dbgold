name: Atualizar Cotacoes (Fixing de Londres)

on:
  schedule:
    # De hora a hora, dias uteis, das 07:05 as 18:05 UTC (cobre Fixing AM 10:30 e PM 15:00 de Londres)
    - cron: '5 7-18 * * 1-5'
    # Fim de semana: 1x por dia para manter o valor fresco
    - cron: '0 12 * * 0,6'
  workflow_dispatch:

jobs:
  update-fixing:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de atualizacao das cotacoes
        run: |
          echo "Disparando atualizacao das cotacoes do Fixing de Londres..."
          curl -f -sS -X GET "https://dbgold.pt/api/cron/update-prices"